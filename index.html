<style>
/* VOICE: тёплый ночной лоу-фай, который взрывается аниме-боем
   IDEA: аркадная кассета — ночная комната, экран, бой, победа
   PICTURE: вся страница — анимированный холст
   COLOUR and TYPE: ночной фиолет, лавандовый Chad, красный акцент; Russo One + Rubik
   LAYOUT: полноэкранный холст, поверх — стартовый и финальный экраны */
:root{color-scheme:dark;--red:#e3122f;--lav:#b9adf7;--ink:#f4f0ff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#07050c;color:var(--ink);overflow:hidden;font:16px/1.5 Rubik,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:manipulation}
.ov{position:fixed;z-index:2;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:24px 24px calc(28px + env(safe-area-inset-bottom));transition:opacity .8s}
.ov.hide{opacity:0;pointer-events:none}
#start{background:linear-gradient(180deg,rgba(7,5,12,0) 30%,rgba(7,5,12,.92) 72%)}#start h1{margin-bottom:22px}
.jp{font:900 15px "Noto Sans JP",sans-serif;color:var(--red);letter-spacing:.3em;margin:0}
h1{font:400 clamp(40px,13vw,64px)/1 "Russo One",Impact,sans-serif;margin:6px 0 4px;color:#fff;text-shadow:3px 3px 0 var(--red)}
h1 span{display:block;font-size:.42em;color:var(--lav);text-shadow:none;margin-top:6px}
.hint{color:#cfc6ef;font-size:15px;margin:6px 0 18px;max-width:30ch}
.btn{appearance:none;border:0;cursor:pointer;font:400 18px "Russo One",sans-serif;color:#000;background:var(--red);padding:16px 34px;border-radius:999px;box-shadow:0 0 0 4px rgba(227,18,47,.25),0 10px 30px rgba(227,18,47,.45);min-height:52px}
.btn:active{transform:scale(.97)}
.btn:focus-visible,#mute:focus-visible{outline:3px solid #fff;outline-offset:3px}
#mute{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,8,18,.55);color:#fff;font:18px system-ui;cursor:pointer;display:none;z-index:5}
#fin{justify-content:center;background:radial-gradient(120% 80% at 50% 40%,rgba(10,6,20,.55),rgba(7,5,12,.92))}
.card{width:min(340px,100%);display:grid;gap:14px;justify-items:center}
.pc{position:relative;width:min(220px,62vw);aspect-ratio:1;border-radius:18px;overflow:hidden;border:3px solid #fff;box-shadow:6px 6px 0 var(--red),0 0 40px rgba(155,140,255,.5);transform:rotate(-3deg)}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.pc b{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font:400 13px "Russo One",sans-serif;background:linear-gradient(transparent,rgba(0,0,0,.85));text-align:left}
.pc i{position:absolute;top:8px;right:8px;font:400 11px "Russo One",sans-serif;font-style:normal;background:var(--red);padding:3px 7px;border-radius:6px}
#fin h2{font:400 clamp(30px,9vw,42px)/1.05 "Russo One",sans-serif;margin:4px 0 0;text-wrap:balance}
#fin p{margin:0;color:#fff;font-size:18px;line-height:1.45;max-width:30ch;text-wrap:pretty}
#fin .sig{color:var(--lav);font-weight:600}
.vert{position:fixed;right:10px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font:900 20px "Noto Sans JP",sans-serif;color:var(--red);opacity:.85;letter-spacing:.15em;pointer-events:none}
@media(max-width:380px){.vert{display:none}}
</style>
</head>

   if(bar>=2||charge)for(const[p,f,d]of LEAD[bar%4])if(p===pos){sv(T,f*2,d*S16,'sawtooth',.05,2800,.03,.45,-6);sv(T,f*2,d*S16,'square',.025,2000,.03,.45,7)}
  })}}
function buildAudio(){
 EV=[];
 E(0,T=>rain(T,9.2,.05));lofi(0,8.4);
 E(7.2,T=>{nz(T,1.6,.18,'bandpass',300,1.5,4000);osc(T,200,1.6,'sawtooth',.05,1800,900)});
 E(9,T=>{kick(T,1);nz(T,.5,.3,'lowpass',3000,1,200)});
 lofi(9.1,B0+4.4,{bpm:88,hard:1});
 ROUNDS.forEach((r,i)=>{const s=R0+i*RD;
  E(s+1,T=>osc(T,900,.25,'square',.06,3000,180));E(s+1.15,T=>osc(T,300,.16,'sine',.12,0,800));
  E(s+1.7,T=>nz(T,.4,.22,'bandpass',400,1.2,3500));
  E(s+2.1,T=>{kick(T,1);nz(T,.3,.45,'lowpass',4000);osc(T,90,.25,'square',.12,800,40)});
  E(s+2.6,T=>{nz(T,.9,.4,'lowpass',1400,1,90);kick(T,.8)})});
 E(B0+1.2,T=>{kick(T,1.2);nz(T,1,.4,'lowpass',600,1,60)});
 [1.3,1.55,1.8].forEach(s=>E(B0+s,T=>{osc(T,700,.2,'square',.05,3000,200);osc(T+.33,1400,.12,'triangle',.1)}));
 E(B0+2,T=>{osc(T,110,2.2,'sawtooth',.08,1200,880);nz(T,2.2,.12,'bandpass',300,2,5000)});
 E(B0+4,T=>nz(T,.4,.3,'bandpass',600,1,4000));
 E(B0+4.4,T=>{nz(T,3.2,.75,'lowpass',5000,1,50);osc(T,70,2.6,'sine',1,0,24);kick(T,1.2)});
 E(KO,T=>{kick(T,1.2);nz(T,.6,.3,'lowpass',2500)});
 E(KO+.9,T=>{[523.3,659.3,784,1046.5].forEach((f,i)=>{osc(T+i*.11,f,.25,'square',.06,3500)});[523.3,659.3,784].forEach(f=>osc(T+.5,f,1.6,'triangle',.08,3000));osc(T+.5,130.8,1.6,'square',.06,800)});
 E(BACK,T=>rain(T,240,.04));lofi(BACK+.3,BACK+240);
 EV.sort((a,b)=>a[0]-b[0]);
}
function startAudio(offset){
 try{initAC();AC.resume();try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(M){const old=M;old.gain.setTargetAtTime(0,AC.currentTime,.03);setTimeout(()=>old.disconnect(),400)}
  const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);M=AC.createGain();M.gain.value=muted?0:.9;M.connect(comp);DS=AC.createGain();{const dl=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter(),wet=AC.createGain();dl.delayTime.value=.409;fb.gain.value=.38;lp.type='lowpass';lp.frequency.value=2400;wet.gain.value=.5;DS.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(wet);wet.connect(M)}
  buildAudio();a0=AC.currentTime+.05-offset;let idx=0;while(idx<EV.length&&EV[idx][0]<offset)idx++;
  clearInterval(timer);timer=setInterval(()=>{const now=AC.currentTime-a0;while(idx<EV.length&&EV[idx][0]<now+.6){const[tt,f]=EV[idx++];try{f(a0+tt)}catch(e){console.error(e)}}},90);
 }catch(e){console.error(e)}
}

/* ---------- control ---------- */
const qs=new URLSearchParams(location.search),freeze=qs.has('t')?+qs.get('t'):null;
let started=false,p0=0;const st=document.getElementById('start'),fin=document.getElementById('fin'),mb=document.getElementById('mute');
function go(){started=true;p0=performance.now();st.classList.add('hide');fin.classList.add('hide');mb.style.display='block';startAudio(0)}
document.getElementById('go').addEventListener('click',go);
document.getElementById('again').addEventListener('click',go);
mb.addEventListener('click',()=>{muted=!muted;mb.textContent=muted?'×':'♪';if(M)M.gain.setTargetAtTime(muted?0:.9,AC.currentTime,.05)});
addEventListener('resize',resize);resize();
if(freeze!=null){started=true;st.style.transition=fin.style.transition='none';st.classList.add('hide');if(freeze>=FIN)fin.classList.remove('hide')}
function loop(now){
 if(freeze!=null)frame(freeze,false);
 else if(!started)frame(now/1000,true);
 else{const t=(now-p0)/1000;frame(t,false);if(t>=FIN&&fin.classList.contains('hide'))fin.classList.remove('hide')}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
}
